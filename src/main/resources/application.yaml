spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/backend?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${PORT:8080}

app:
  teacher-code: ${TEACHER_CODE}
  cors:
    # 프론트 배포 주소 추가 시 CORS_ALLOWED_ORIGINS 환경변수로 덮어씀 (쉼표 구분)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://11bit.vercel.app,http://127.0.0.1:5500,http://localhost:5500}